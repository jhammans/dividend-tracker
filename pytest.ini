[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*

# Exclude integration tests by default (they require a live PostgreSQL instance)
# Coverage gate: set to current baseline (24%). Raise this as new test files are added.
# Target per standards: 80% overall, 84%+ already achieved for lot_tracker.py
addopts = -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=23

markers =
    integration: requires a live PostgreSQL database (deselect with -m "not integration")
