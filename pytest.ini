[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*

# Exclude integration tests by default (they require a live PostgreSQL instance)
# Coverage gate: raised to 55% after adding transaction and holdings tests.
# Target per standards: 80% overall. Raise as more tests are added.
addopts = -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=55

markers =
    integration: requires a live PostgreSQL database (deselect with -m "not integration")
